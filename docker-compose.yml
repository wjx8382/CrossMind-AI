services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crossmind
      POSTGRES_USER: crossmind
      POSTGRES_PASSWORD: crossmind
    ports:
      - "${CROSSMIND_POSTGRES_PORT:-5432}:5432"
    volumes:
      - crossmind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossmind -d crossmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${CROSSMIND_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crossmind_postgres_data:
