spring:
  application:
    name: crossmind-ai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crossmind}
    username: ${DB_USERNAME:crossmind}
    password: ${DB_PASSWORD:crossmind}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

mock-data:
  location: ${MOCK_DATA_LOCATION:classpath:mock-data/products.json}

agent:
  execution-delay-ms: ${AGENT_EXECUTION_DELAY_MS:650}

ai:
  provider: ${AI_PROVIDER:bailian}
  api-key: ${DASHSCOPE_API_KEY:}
  model: ${AI_MODEL:qwen3.7-plus}
  base-url: ${AI_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  connect-timeout: ${AI_CONNECT_TIMEOUT:10s}
  read-timeout: ${AI_READ_TIMEOUT:60s}
