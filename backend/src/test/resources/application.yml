spring:
  datasource:
    url: jdbc:h2:mem:crossmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false

mock-data:
  location: classpath:mock-data/products.json

agent:
  execution-delay-ms: 0
