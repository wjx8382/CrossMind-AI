services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crossmind}
      DB_USERNAME: ${POSTGRES_USER:-crossmind}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen3.7-plus}
      AI_BASE_URL: ${AI_BASE_URL:-https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crossmind}
      POSTGRES_USER: ${POSTGRES_USER:-crossmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - crossmind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossmind} -d ${POSTGRES_DB:-crossmind}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  crossmind_postgres_data:
